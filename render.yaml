services:
  # ── Backend (Express) ──────────────────────────────────────────────────────
  - type: web
    name: placeit-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Secrets below are set in the Render dashboard (sync: false = never stored in git)
      - key: AI_SERVICE_API_KEY
        sync: false
    plan: free

  # ── AI Service (FastAPI) ───────────────────────────────────────────────────
  - type: web
    name: placeit-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt && python model/train.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: APP_ENV
        value: production      # refuse to run without AI_SERVICE_API_KEY
      - key: AI_SERVICE_API_KEY
        sync: false            # must equal the backend's AI_SERVICE_API_KEY
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.8-flash
